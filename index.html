<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Economy - Supabase Test</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div id="navbar-root"></div>

    <main class="app">
      <section class="panel">
        <div class="section-heading">
          <h1>Dashboard</h1>
          <p class="subtitle">Test connessione Supabase e lettura tabella transactions.</p>
        </div>

        <div class="status-row">
          <span class="status-label">Stato:</span>
          <span id="connection-status" class="status status-warning">Credenziali da configurare</span>
        </div>

        <button id="load-transactions" type="button">Carica transactions</button>

        <section class="results">
          <h2>Risultati</h2>
          <div id="transactions-output" class="output-container">Nessun dato caricato.</div>
        </section>
      </section>
    </main>
  </body>
</html>
