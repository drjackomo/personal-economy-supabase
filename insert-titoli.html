<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>Insert Titoli - Personal Economy</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div id="navbar-root"></div>

    <main class="app movimenti-page titoli-insert-page">
      <div class="titoli-page-heading">
        <h1>Inserimento Titoli</h1>
      </div>

      <input id="titoli-snapshot-date" type="hidden" name="snapshot-date">
      <section class="titoli-week-card" aria-label="Calendario snapshot">
        <div id="titoli-week-picker" class="titoli-week-picker" aria-label="Selettore settimana snapshot"></div>
      </section>

      <div id="titoli-insert-root" class="titoli-insert-root">
        <div class="loading-state">
          <span class="spinner"></span>
          <span>Caricamento titoli...</span>
        </div>
      </div>
    </main>
  </body>
</html>
