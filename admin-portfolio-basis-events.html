<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>Portfolio Basis - Personal Economy</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div id="navbar-root"></div>

    <main id="admin-portfolio-basis-events-page" class="app dashboard-page admin-page">
      <div class="dashboard-heading">
        <h1>Portfolio Basis</h1>
        <p class="subtitle">Gestione eventi base portfolio</p>
      </div>

      <section class="admin-db-layout" aria-label="Gestione portfolio basis events">
        <article class="dashboard-chart-section admin-db-table-card" aria-labelledby="admin-portfolio-basis-events-table-title">
          <div class="dashboard-chart-header">
            <h2 id="admin-portfolio-basis-events-table-title" class="chart-title">Tabella Portfolio Basis</h2>
          </div>
          <div id="admin-portfolio-basis-events-state" class="dashboard-chart-state is-visible" aria-live="polite">Caricamento eventi...</div>
          <div class="admin-db-table-wrap">
            <table id="admin-portfolio-basis-events-table" class="transactions-table admin-db-table">
              <thead>
                <tr>
                  <th>Effective Date</th>
                  <th>Dossier</th>
                  <th>ISIN</th>
                  <th>Asset Name</th>
                  <th>Cost Basis</th>
                  <th>Note</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </article>

        <article class="dashboard-chart-section admin-db-form-card" aria-labelledby="admin-portfolio-basis-event-form-title">
          <div class="dashboard-chart-header">
            <h2 id="admin-portfolio-basis-event-form-title" class="chart-title">Dettaglio Evento</h2>
          </div>
          <form id="admin-portfolio-basis-event-form" class="admin-db-form">
            <input id="admin-portfolio-basis-event-id" type="hidden">
            <label class="admin-db-field">
              <span>Effective Date</span>
              <input id="admin-portfolio-basis-event-effective-date" class="chart-input" type="date">
            </label>
            <label class="admin-db-field">
              <span>Dossier</span>
              <select id="admin-portfolio-basis-event-dossier-id" class="chart-input"></select>
            </label>
            <label class="admin-db-field">
              <span>Asset</span>
              <select id="admin-portfolio-basis-event-asset" class="chart-input"></select>
            </label>
            <label class="admin-db-field">
              <span>ISIN</span>
              <input id="admin-portfolio-basis-event-isin" class="chart-input" type="text">
            </label>
            <label class="admin-db-field">
              <span>Asset Name</span>
              <input id="admin-portfolio-basis-event-asset-name" class="chart-input" type="text">
            </label>
            <label class="admin-db-field">
              <span>Cost Basis</span>
              <input id="admin-portfolio-basis-event-cost-basis" class="chart-input" type="text" inputmode="decimal">
            </label>
            <label class="admin-db-field">
              <span>Note</span>
              <textarea id="admin-portfolio-basis-event-note" class="chart-input admin-db-textarea"></textarea>
            </label>
            <div class="admin-db-form-actions">
              <button id="admin-portfolio-basis-event-new" class="chart-btn ghost" type="button">Nuovo</button>
              <button id="admin-portfolio-basis-event-delete" class="chart-btn danger" type="button" disabled>Elimina</button>
              <button id="admin-portfolio-basis-event-save" class="chart-btn" type="submit">Salva</button>
            </div>
          </form>
        </article>
      </section>
    </main>

    <div id="admin-portfolio-basis-event-delete-modal" class="modal-overlay" aria-hidden="true">
      <div class="modal-card admin-confirm-modal-card" role="dialog" aria-modal="true" aria-labelledby="admin-portfolio-basis-event-delete-title">
        <div class="modal-header">
          <div>
            <h2 id="admin-portfolio-basis-event-delete-title">Eliminare evento?</h2>
            <p class="admin-confirm-message">Confermi l'eliminazione dell'evento selezionato?</p>
          </div>
        </div>

        <div class="modal-actions">
          <button id="admin-portfolio-basis-event-cancel-delete" class="secondary-action" type="button">Annulla</button>
          <button id="admin-portfolio-basis-event-confirm-delete" class="danger-action" type="button">Elimina</button>
        </div>
      </div>
    </div>

    <div id="admin-alert-modal" class="modal-overlay" aria-hidden="true">
      <div class="modal-card admin-confirm-modal-card" role="dialog" aria-modal="true" aria-labelledby="admin-alert-title">
        <div class="modal-header">
          <div>
            <h2 id="admin-alert-title">Attenzione</h2>
            <p id="admin-alert-message" class="admin-confirm-message"></p>
          </div>
          <button id="admin-alert-close" class="modal-close" type="button" aria-label="Chiudi">&times;</button>
        </div>

        <div class="modal-actions">
          <button id="admin-alert-ok" class="chart-btn" type="button">OK</button>
        </div>
      </div>
    </div>
  </body>
</html>
